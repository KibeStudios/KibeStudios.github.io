

<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" 
      type="image/png" 
      href="images/BlocktownIcon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>BlockTown</title>
    <link href="style.css" rel="stylesheet" type="text/css" media="all" />

    <style>
      .navbar {
        background-color: #0575bb;
        padding: 0px;
        display: flex;
        gap: 0px;
      }

      .navbar button {
        background-color: #0575bb;
        color: white;
        padding: 5px 45px;
        font-size: 22px;
        border: none;
        border-radius: 0;
        cursor: pointer;
        transition: background-color none;
      }

      .navbar button:hover {
        background-color: #2898de;
      }
    </style>
  </head>

  <body>
    <div class="navbar">
        <img src="images/Logo 153x31.png"/>
      <button onclick="location.href='https://blocktown.neocities.org/'">Home</button>
      <button onclick="location.href='https://discord.gg/fs8w2SgqSf'">Server (with download)</button>
      <button onclick="location.href='https://x.com/PlayBlockTown'">Twitter</button>
    </div>
    

    <h1>Welcome to my Website!</h1>

    <p>
      This is a paragraph! Here's how you make a link:
      <a href="https://neocities.org">Neocities</a>.
    </p>

    <p>Here's how you can make <strong>bold</strong> and <em>italic</em> text.</p>

    <p>Here's how you can add an image:</p>
    <img src="/neocities.png" alt="Neocities logo" />

    <p>Here's how to make a list:</p>
    <ul>
      <li>First thing</li>
      <li>Second thing</li>
      <li>Third thing</li>
    </ul>

    <p>
      To learn more HTML/CSS, check out these
      <a href="https://neocities.org/tutorials">tutorials</a>!
    </p>
  </body>
</html>
